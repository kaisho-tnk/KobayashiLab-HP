<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サイトマップ | 小林研究室 JAXA宇宙科学研究所</title>
    <meta name="description" content="小林研究室 JAXA宇宙科学研究所 公式サイトのサイトマップです。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/theme.js"></script>
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/icons/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="assets/img/icons/favicon-64.png">
    <link rel="icon" type="image/png" sizes="128x128" href="assets/img/icons/favicon-128.png">
    <link rel="icon" type="image/png" sizes="256x256" href="assets/img/icons/favicon-256.png">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-brand-light flex flex-col min-h-screen page-fade-enter" data-page="sitemap">
    <div id="page-transition-overlay"><div class="spinner-wrap"><img src="assets/img/icons/labicon-1000.png" alt=""><span class="spinner-ring" aria-hidden="true"></span></div></div>

    <header id="site-header"></header>

    <main class="flex-grow pt-20">
        <div class="page-header-bg py-14 sm:py-16 text-center">
            <h1 class="text-3xl sm:text-4xl font-bold text-brand-dark tracking-widest uppercase">Sitemap</h1>
            <p class="text-gray-500 mt-2" data-en="All Pages on This Site">サイト内の全ページ</p>
        </div>

        <section class="section-padding">
            <div class="max-w-4xl mx-auto page-container">
                <!-- 中身は assets/js/sitemap.js が data/*.js から自動生成します。
                     ページや研究テーマ・News記事・メンバーが増減しても、このファイルは編集不要です。 -->
                <div id="sitemap-content" class="fade-up"></div>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="data/site.js"></script>
    <script src="data/news.js"></script>
    <script src="data/research.js"></script>
    <script src="data/facilities.js"></script>
    <script src="data/members.js"></script>
    <script src="assets/js/site.js"></script>
    <script src="assets/js/sitemap.js"></script>
</body>
</html>
