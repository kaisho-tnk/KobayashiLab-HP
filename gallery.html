<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | 東京大学 〇〇研究室</title>
    <meta name="description" content="東京大学 〇〇研究室のギャラリー。実験・活動の様子を写真で紹介します。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/theme.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-brand-light flex flex-col min-h-screen page-fade-enter" data-page="gallery">

    <header id="site-header"></header>

    <main class="flex-grow pt-20">
        <div class="page-header-bg py-14 sm:py-16 text-center">
            <h1 class="text-3xl sm:text-4xl font-bold text-brand-dark tracking-widest uppercase">Gallery</h1>
            <p class="text-gray-500 mt-2">活動・実験の様子</p>
        </div>

        <section class="section-padding">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">

                <!-- 写真は 3〜4列のグリッドで並べる。1枚追加するときは figure ブロックをコピーして増やす -->
                <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">

                    <!-- ▼ 写真1枚分（ここから </figure> までをコピーして増やす） -->
                    <figure class="fade-up group rounded-xl overflow-hidden border border-gray-200 bg-white">
                        <div class="aspect-square overflow-hidden bg-brand-blue/10">
                            <img src="https://placehold.co/600x600/4D9BC1/ffffff?text=Photo+1" alt="実験の様子" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        </div>
                        <figcaption class="p-3 text-sm text-gray-600">燃焼実験の様子</figcaption>
                    </figure>
                    <!-- ▲ ここまで -->

                    <figure class="fade-up group rounded-xl overflow-hidden border border-gray-200 bg-white" style="transition-delay: 50ms;">
                        <div class="aspect-square overflow-hidden bg-brand-yellow/20">
                            <img src="https://placehold.co/600x600/F2C75C/ffffff?text=Photo+2" alt="研究室メンバー" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        </div>
                        <figcaption class="p-3 text-sm text-gray-600">研究室メンバー集合写真</figcaption>
                    </figure>

                    <figure class="fade-up group rounded-xl overflow-hidden border border-gray-200 bg-white" style="transition-delay: 100ms;">
                        <div class="aspect-square overflow-hidden bg-brand-blue/10">
                            <img src="https://placehold.co/600x600/4D9BC1/ffffff?text=Photo+3" alt="学会発表" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        </div>
                        <figcaption class="p-3 text-sm text-gray-600">学会発表の様子</figcaption>
                    </figure>

                    <figure class="fade-up group rounded-xl overflow-hidden border border-gray-200 bg-white" style="transition-delay: 150ms;">
                        <div class="aspect-square overflow-hidden bg-brand-yellow/20">
                            <img src="https://placehold.co/600x600/F2C75C/ffffff?text=Photo+4" alt="能代実験場" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        </div>
                        <figcaption class="p-3 text-sm text-gray-600">能代ロケット実験場での実験準備</figcaption>
                    </figure>

                    <figure class="fade-up group rounded-xl overflow-hidden border border-gray-200 bg-white" style="transition-delay: 200ms;">
                        <div class="aspect-square overflow-hidden bg-brand-blue/10">
                            <img src="https://placehold.co/600x600/4D9BC1/ffffff?text=Photo+5" alt="展示ブース" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        </div>
                        <figcaption class="p-3 text-sm text-gray-600">展示ブースの様子</figcaption>
                    </figure>

                    <figure class="fade-up group rounded-xl overflow-hidden border border-gray-200 bg-white" style="transition-delay: 250ms;">
                        <div class="aspect-square overflow-hidden bg-brand-yellow/20">
                            <img src="https://placehold.co/600x600/F2C75C/ffffff?text=Photo+6" alt="実験装置" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        </div>
                        <figcaption class="p-3 text-sm text-gray-600">実験装置の組み立て</figcaption>
                    </figure>

                </div>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="data/site.js"></script>
    <script src="data/news.js"></script>
    <script src="assets/js/site.js"></script>
</body>
</html>
