<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東京大学 〇〇研究室</title>
    <meta name="description" content="東京大学 〇〇研究室の公式サイト。研究テーマ、メンバー、最新のお知らせを掲載しています。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/theme.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* ヒーロー画像のゆっくりズーム */
        #hero-img { transform: scale(1.08); transition: transform 12s ease-out; }
        #hero-img.zoomed { transform: scale(1); }
    </style>
</head>
<body class="bg-brand-light flex flex-col min-h-screen page-fade-enter" data-page="home">
    <div id="page-transition-overlay"><div class="spinner-wrap"><img src="assets/img/icon.png" alt=""><span class="spinner-ring" aria-hidden="true"></span></div></div>


    <header id="site-header"></header>

    <main class="flex-grow">
        <!-- Hero：コンパクトな帯レイアウト -->
        <section class="relative mt-20 overflow-hidden">
            <div class="absolute inset-0 z-0 bg-brand-dark overflow-hidden">
                <!--
                  動画を用意できるまでは poster 画像（フォールバック）だけが表示されます。
                  実際のATRIUMエンジン着火試験の映像・画像が用意でき次第、
                  assets/video/hero-ignition.mp4 と assets/img/hero-ignition-poster.jpg を差し替えてください。
                -->
                <video id="hero-video" autoplay muted loop playsinline
                       poster="https://placehold.co/1920x1080/1e293b/1e293b?text=ATRIUM+Engine+Ignition"
                       class="w-full h-full object-cover opacity-70">
                    <source src="assets/video/hero-ignition.mp4" type="video/mp4">
                </video>
                <div class="absolute inset-0 bg-brand-dark/60"></div>
            </div>
            <div class="relative z-10 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-24">
                <span class="hero-animate inline-block text-white/70 font-medium text-xs sm:text-sm mb-4 tracking-[0.2em]">
                    RESEARCH LABORATORY
                </span>
                <h1 class="hero-animate delay-100 text-2xl sm:text-3xl md:text-4xl font-semibold text-white mb-4 leading-snug">
                    <a href="about.html" class="hover:opacity-80 transition-opacity" data-en="Toward a research base that changes the world">世界を変える、次世代の研究拠点へ</a>
                </h1>
                <p class="hero-animate delay-200 text-sm sm:text-base text-gray-300 mb-8 max-w-xl" data-en="From fundamental research to real-world application, we take on challenges across disciplines, creating knowledge that contributes to society.">
                    基礎から応用まで、分野の垣根を超えた挑戦を続けています。知の創造を通じて、社会に貢献する技術を育みます。
                </p>
                <div class="hero-animate delay-300 flex flex-wrap gap-3">
                    <a href="#section-research" class="px-6 py-2.5 bg-white text-brand-dark font-medium rounded-full hover:bg-gray-100 transition-colors duration-300 text-sm" data-en="View Research">研究テーマを見る</a>
                    <a href="#section-facilities" class="px-6 py-2.5 border border-white/40 text-white font-medium rounded-full hover:bg-white/10 transition-colors duration-300 text-sm" data-en="View Facilities">研究拠点を見る</a>
                </div>
            </div>
        </section>

        <!-- Research（研究テーマの3枚プレビュー） -->
        <section id="section-research" data-scroll-gap="0" class="py-14 sm:py-16 bg-white">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="fade-up flex flex-wrap justify-between items-end gap-3 mb-6">
                    <h2 class="text-xl sm:text-2xl font-semibold text-brand-dark">Research</h2>
                    <a href="research/index.html" class="text-brand-blue text-sm font-medium hover:text-blue-700 transition-colors inline-flex items-center group">
                        <span data-en="View All">すべて見る</span>
                        <svg class="w-4 h-4 ml-1 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </a>
                </div>
                <div id="research-preview" class="fade-up grid sm:grid-cols-3 gap-4"></div>
            </div>
        </section>

        <!-- Facilities（Researchセクションと同様の3枚プレビュー） -->
        <section id="section-facilities" data-scroll-gap="0" class="py-14 sm:py-16 bg-brand-light border-t border-gray-100">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="fade-up flex flex-wrap justify-between items-end gap-3 mb-6">
                    <h2 class="text-xl sm:text-2xl font-semibold text-brand-dark">Facilities</h2>
                    <a href="facilities/index.html" class="text-brand-blue text-sm font-medium hover:text-blue-700 transition-colors inline-flex items-center group">
                        <span data-en="View All">すべて見る</span>
                        <svg class="w-4 h-4 ml-1 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </a>
                </div>
                <div id="facilities-preview" class="fade-up grid sm:grid-cols-3 gap-4"></div>
            </div>
        </section>

        <!-- Recent News（data/news.js から自動生成） -->
        <section class="py-14 sm:py-16 bg-white border-t border-gray-100">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="fade-up flex flex-wrap justify-between items-end gap-3 mb-6">
                    <h2 class="text-xl sm:text-2xl font-semibold text-brand-dark">News</h2>
                    <a href="news.html" class="text-brand-blue text-sm font-medium hover:text-blue-700 transition-colors inline-flex items-center group">
                        <span data-en="View All">すべて見る</span>
                        <svg class="w-4 h-4 ml-1 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </a>
                </div>
                <div class="fade-up bg-white rounded-xl border border-gray-200 p-4 sm:p-6" style="transition-delay: 100ms;">
                    <ul id="news-preview" data-limit="3"></ul>
                </div>
            </div>
        </section>

        <!-- Members（メンバープレビュー） -->
        <section class="py-14 sm:py-16 bg-brand-light border-t border-gray-100">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="fade-up flex flex-wrap justify-between items-end gap-3 mb-6">
                    <h2 class="text-xl sm:text-2xl font-semibold text-brand-dark">Members</h2>
                    <a href="members.html" class="text-brand-blue text-sm font-medium hover:text-blue-700 transition-colors inline-flex items-center group">
                        <span data-en="View All">すべて見る</span>
                        <svg class="w-4 h-4 ml-1 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </a>
                </div>
                <div class="relative -mx-4 sm:mx-0">
                    <div id="members-preview" class="fade-up flex gap-4 overflow-x-auto pb-2 px-4 sm:px-0" style="transition-delay: 100ms; scrollbar-width: thin;"></div>
                    <div id="members-scroll-fade-left" class="pointer-events-none absolute inset-y-0 left-0 w-32 bg-gradient-to-r from-white to-transparent opacity-0 transition-opacity duration-200"></div>
                    <div id="members-scroll-fade-right" class="pointer-events-none absolute inset-y-0 right-0 w-32 bg-gradient-to-l from-white to-transparent opacity-0 transition-opacity duration-200"></div>
                </div>
            </div>
        </section>
        <!-- Gallery（最新3枚のミニマルなサムネイル） -->
        <section class="py-14 sm:py-16 bg-white border-t border-gray-100">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="fade-up flex flex-wrap justify-between items-end gap-3 mb-6">
                    <h2 class="text-xl sm:text-2xl font-semibold text-brand-dark">Gallery</h2>
                    <a href="gallery.html" class="text-brand-blue text-sm font-medium hover:text-blue-700 transition-colors inline-flex items-center group">
                        <span data-en="View All">すべて見る</span>
                        <svg class="w-4 h-4 ml-1 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </a>
                </div>
                <ul id="gallery-preview" data-limit="3" class="fade-up grid grid-cols-3 gap-3" style="transition-delay: 100ms;"></ul>
            </div>
        </section>

        <!-- 配属を検討している方へのCTA -->
        <section class="py-14 sm:py-16 bg-brand-light border-t border-gray-100">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                <a href="join.html" class="fade-up group inline-flex items-center px-6 py-3 bg-brand-dark text-white font-medium rounded-lg hover:bg-gray-800 transition-colors duration-300">
                    <span data-en="Considering Joining Us?">配属を検討している方はこちら</span>
                    <svg class="w-5 h-5 ml-2 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </a>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="data/site.js"></script>
    <script src="data/news.js"></script>
    <script src="data/gallery.js"></script>
    <script src="data/members.js"></script>
    <script src="data/research.js"></script>
    <script src="data/facilities.js"></script>
    <script src="assets/js/site.js"></script>
    <script src="assets/js/gallery.js"></script>
    <script src="assets/js/members.js"></script>
    <script src="assets/js/research.js"></script>
    <script src="assets/js/facilities.js"></script>
    <script>
        // ヒーロー画像のズーム開始
        window.addEventListener('load', function () {
            var img = document.getElementById('hero-img');
            if (img) img.classList.add('zoomed');
        });
    </script></body>
</html>
