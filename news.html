<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News | 東京大学 〇〇研究室</title>
    <meta name="description" content="東京大学 〇〇研究室のお知らせ・最新情報の一覧です。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/theme.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-brand-light flex flex-col min-h-screen page-fade-enter" data-page="news">

    <header id="site-header"></header>

    <main class="flex-grow pt-20">
        <div class="page-header-bg py-14 sm:py-16 text-center">
            <h1 class="text-3xl sm:text-4xl font-bold text-brand-dark tracking-widest uppercase">News</h1>
            <p class="text-gray-500 mt-2">お知らせ・最新情報</p>
        </div>

        <section class="section-padding">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">

                <!-- カテゴリ絞り込み（カテゴリは data/news.js から自動収集） -->
                <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                    <div id="news-filter" class="flex flex-wrap gap-2"></div>
                    <p id="news-count" class="text-sm text-gray-500"></p>
                </div>

                <div class="bg-white rounded-xl border border-gray-200 p-4 sm:p-8">
                    <ul id="news-list" data-page-size="10"></ul>
                </div>

                <div id="news-more-wrap" class="hidden text-center mt-8">
                    <button id="news-more" type="button" class="px-8 py-3 border border-brand-blue text-brand-blue font-bold rounded-full hover:bg-brand-blue hover:text-white transition-colors">
                        さらに表示する
                    </button>
                </div>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="data/site.js"></script>
    <script src="data/news.js"></script>
    <script src="assets/js/site.js"></script></body>
</html>
