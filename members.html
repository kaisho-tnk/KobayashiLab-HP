<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members | 東京大学 〇〇研究室</title>
    <meta name="description" content="東京大学 〇〇研究室の教員・学生メンバー紹介。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/theme.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-white flex flex-col min-h-screen page-fade-enter" data-page="members">
    <div id="page-transition-overlay"><div class="spinner-wrap"><img src="assets/img/icon.png" alt=""><span class="spinner-ring" aria-hidden="true"></span></div></div>


    <header id="site-header"></header>

    <main class="flex-grow pt-20">
        <div class="page-header-bg py-14 sm:py-16 text-center">
            <h1 class="text-3xl sm:text-4xl font-bold text-brand-dark tracking-widest uppercase">Members</h1>
            <p class="text-gray-500 mt-2" data-en="Faculty, Students &amp; Alumni">研究室の教員・学生紹介</p>
        </div>

        <section class="section-padding">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">

                <!-- Faculty（data/members.js から自動生成。Professor〜Project Assistant Professorが対象） -->
                <div class="text-center mb-10 fade-up">
                    <h2 class="heading-underline">Faculty</h2>
                </div>
                <div id="members-faculty" class="fade-up flex flex-col gap-6 mb-20" style="transition-delay: 100ms;"></div>

                <!-- Students（data/members.js から自動生成。status: 'D1'/'M1'/'B4' 等が対象） -->
                <div class="text-center mb-10 fade-up">
                    <h2 class="heading-underline">Students</h2>
                </div>
                <ul id="members-students" class="fade-up flex flex-col gap-6" style="transition-delay: 100ms;"></ul>

                <!-- Staff（data/members.js から自動生成。TA/ポスドク/秘書等が対象。0人の間は自動で非表示） -->
                <div id="members-staff-section">
                    <div class="text-center mt-20 mb-10 fade-up">
                        <h2 class="heading-underline">Staff</h2>
                    </div>
                    <ul id="members-staff" class="fade-up flex flex-col gap-6" style="transition-delay: 100ms;"></ul>
                </div>

                <!-- Alumni（data/members.js から自動生成。status: 'OB'/'OG' が対象。0人の間は自動で非表示） -->
                <div id="members-alumni-section">
                    <div class="text-center mt-20 mb-10 fade-up">
                        <h2 class="heading-underline">Alumni</h2>
                    </div>
                    <div id="members-alumni" class="fade-up max-w-3xl mx-auto bg-brand-light rounded-xl border border-gray-100 p-6 sm:p-8"></div>
                </div>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="data/site.js"></script>
    <script src="data/news.js"></script>
    <script src="data/members.js"></script>
    <script src="assets/js/site.js"></script>
    <script src="assets/js/members.js"></script></body>
</html>
